services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - GIGACHAT_KEY=${GIGACHAT_KEY:-}
      - HH_CLIENT_ID=${HH_CLIENT_ID:-}
      - HH_CLIENT_SECRET=${HH_CLIENT_SECRET:-}
      - HH_REDIRECT_URI=${HH_REDIRECT_URI:-}
      - SUPERJOB_CLIENT_ID=${SUPERJOB_CLIENT_ID:-}
      - SUPERJOB_CLIENT_SECRET=${SUPERJOB_CLIENT_SECRET:-}
      - SUPERJOB_REDIRECT_URI=${SUPERJOB_REDIRECT_URI:-}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - APP_LOG_PATH=${APP_LOG_PATH:-/var/log/skillsphere/app.log}
    volumes:
      - sqlite_data:/app/instance
      - uploads_data:/app/app/static/uploads
      - logs_data:/var/log/skillsphere
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:rw
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:rw
    depends_on:
      - prometheus
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    environment:
      - ELK_INDEX_PREFIX=${ELK_INDEX_PREFIX:-skillsphere}
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logs_data:/var/log/skillsphere:ro
    depends_on:
      - elasticsearch
      - web
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  logs_data:
