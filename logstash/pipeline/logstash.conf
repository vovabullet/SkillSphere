input {
  file {
    path => "/var/log/skillsphere/app.log"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-sincedb"
    codec => json
  }
}

filter {
  if ![timestamp] {
    mutate { add_field => { "timestamp" => "%{@timestamp}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "${ELK_INDEX_PREFIX:-skillsphere}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
